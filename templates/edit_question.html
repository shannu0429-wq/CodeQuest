<!DOCTYPE html>
<html>

<head>
    <title>CodeQuest - Edit Question</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>

<body>

<h1>CodeQuest</h1>

<h2>Edit Question</h2>

<form method="post">

    <label>Question:</label>
    <br>

    <textarea
        name="question"
        rows="4"
        cols="50"
        required
    >{{ question["question"] }}</textarea>

    <br><br>

    <label>Code:</label>
    <br>

    <textarea
        name="code"
        rows="8"
        cols="50"
    >{{ question["code"] or "" }}</textarea>

    <br><br>

    <label>Option A:</label>
    <br>

    <input
        type="text"
        name="option_a"
        value="{{ question['option_a'] }}"
        required
    >

    <br><br>

    <label>Option B:</label>
    <br>

    <input
        type="text"
        name="option_b"
        value="{{ question['option_b'] }}"
        required
    >

    <br><br>

    <label>Option C:</label>
    <br>

    <input
        type="text"
        name="option_c"
        value="{{ question['option_c'] }}"
        required
    >

    <br><br>

    <label>Option D:</label>
    <br>

    <input
        type="text"
        name="option_d"
        value="{{ question['option_d'] }}"
        required
    >

    <br><br>

    <label>Correct Answer:</label>
    <br>

    <select name="correct_answer" required>

        <option value="A"
        {% if question["correct_answer"] == "A" %}selected{% endif %}>
            A
        </option>

        <option value="B"
        {% if question["correct_answer"] == "B" %}selected{% endif %}>
            B
        </option>

        <option value="C"
        {% if question["correct_answer"] == "C" %}selected{% endif %}>
            C
        </option>

        <option value="D"
        {% if question["correct_answer"] == "D" %}selected{% endif %}>
            D
        </option>

    </select>

    <br><br>

    <button type="submit">
        Update Question
    </button>

</form>

<br>

<a href="/admin/quiz/{{ question['quiz_id'] }}">
    Back to Questions
</a>

</body>

</html>
