<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - Login</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>

<body class="login-page">

    <!-- Navigation Bar -->
    <nav class="index-navbar" style="position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: rgba(0,0,0,0.2); z-index: 10; box-sizing: border-box;">
        <div class="index-logo" style="font-weight: bold; font-size: 20px; color: white;">
            💻 CodeQuest
        </div>
        <div class="index-nav-buttons">
            <a href="index.html" class="index-login-btn" style="color: white; border: 1px solid white; padding: 6px 16px; border-radius: 4px; text-decoration: none; font-weight: bold; background: transparent; transition: background 0.2s;">Home</a>
        </div>
    </nav>

<div class="login-container">
    <div class="login-card">
        <h1>CodeQuest 💻</h1>
        <p class="login-subtitle">
            Test your coding skills and build your streak 🔥
        </p>
        <h2>Welcome Back!</h2>

        <div id="errorAlert" class="alert alert-error" style="display: none; flex-direction: column; align-items: flex-start; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
                <span class="alert-icon">❌</span>
                <div>
                    <strong>Login Failed</strong>
                    <p id="errorMessage" style="margin: 0;"></p>
                </div>
            </div>
            <div id="renderUrlConfig" style="width: 100%; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px; margin-top: 5px; display: none;">
                <label style="font-size: 13px; font-weight: bold; display: block; color: inherit; margin-bottom: 5px;">Configure Render API Backend URL:</label>
                <input type="text" id="customApiUrl" placeholder="https://your-backend.onrender.com" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; color: #333;">
                <button type="button" id="saveApiUrlBtn" style="margin-top: 8px; padding: 6px 12px; font-size: 13px; background-color: #2f9e44; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Save & Retry</button>
            </div>
        </div>

        <form id="loginForm">
            <label>Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                required
            >
            <br>

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >
            <br>

            <button type="submit">
                Login
            </button>
        </form>
    </div>
</div>

<script>
    // Redirect if already logged in
    if (localStorage.getItem('user_id')) {
        const role = localStorage.getItem('role');
        if (role === 'admin') {
            window.location.href = 'admin.html';
        } else {
            window.location.href = 'dashboard.html';
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');

        errorAlert.style.display = 'none';

        try {
            const response = await fetch(`${API_BASE_URL}/api/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: usernameInput,
                    password: passwordInput
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Login failed. Please try again.');
            }

            // Save to localStorage
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('username', data.username);
            localStorage.setItem('role', data.role);

            // Redirect
            if (data.role === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        } catch (err) {
            errorMessage.textContent = err.message;
            errorAlert.style.display = 'flex';
            
            // Show custom URL config if connection failed (Failed to fetch)
            if (err.message.includes('Failed to fetch') || err.message.includes('network') || err.name === 'TypeError') {
                document.getElementById('renderUrlConfig').style.display = 'block';
                document.getElementById('customApiUrl').value = API_BASE_URL;
            }
        }
    });

    document.getElementById('saveApiUrlBtn').addEventListener('click', () => {
        let val = document.getElementById('customApiUrl').value.trim();
        if (val) {
            if (val.endsWith('/')) {
                val = val.slice(0, -1);
            }
            localStorage.setItem('api_base_url', val);
            window.location.reload();
        }
    });
</script>
</body>
</html>
