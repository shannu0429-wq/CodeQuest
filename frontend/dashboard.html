<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - Dashboard</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>CodeQuest 💻</h2>
    <div style="display: flex; gap: 18px; align-items: center;">
        <!-- Notification Dropdown Toggle -->
        <div class="notif-container" style="position: relative; display: inline-block;">
            <button id="notifBtn" onclick="toggleNotifDropdown()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: white; position: relative; padding: 5px;">
                🔔<span id="notifBadge" style="position: absolute; top: -2px; right: -2px; background-color: #e03131; color: white; font-size: 10px; font-weight: bold; border-radius: 50%; padding: 2px 6px; display: none;">0</span>
            </button>
            <div id="notifDropdown" style="display: none; position: absolute; right: 0; top: 35px; width: 300px; background: white; border: 1px solid #dee2e6; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 8px; z-index: 1000; max-height: 400px; overflow-y: auto;">
                <div style="padding: 12px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; color: #333;">
                    <span>Announcements</span>
                    <button onclick="markAllNotifAsRead()" style="background: none; border: none; font-size: 12px; color: #228be6; cursor: pointer; text-decoration: underline; padding: 0;">Mark Read</button>
                </div>
                <div id="notifList" style="padding: 0; margin: 0; color: #495057;">
                    <div style="padding: 15px; text-align: center; color: #868e96;">No notifications.</div>
                </div>
            </div>
        </div>
        <a href="#" onclick="logout(); return false;" style="color: white; text-decoration: none; font-weight: bold;">Logout</a>
    </div>
</div>

<div class="container">
    <!-- Welcome -->
    <div class="welcome-section">
        <h2>
            Welcome, <span id="usernameSpan">Student</span> 👋
        </h2>
        <p>
            Keep learning and improve your coding skills!
        </p>
    </div>

    <!-- STATS -->
    <div class="card-container">
        <div class="card">
            <h3>🔥 Current Streak</h3>
            <div class="stat-number" id="currentStreak">0</div>
            <p>days</p>
        </div>

        <div class="card">
            <h3>🏆 Longest Streak</h3>
            <div class="stat-number" id="longestStreak">0</div>
            <p>days</p>
        </div>

        <div class="card">
            <h3>⭐ Total Score</h3>
            <div class="stat-number" id="totalScore">0</div>
            <p>points</p>
        </div>
    </div>

    <!-- QUIZZES -->
    <h2 class="quiz-section-title">
        Available Quizzes 📝
    </h2>

    <div class="dashboard-quizzes" id="quizzesContainer">
        <!-- Quizzes will be loaded here dynamically -->
        <div class="no-quizzes">
            <p>Loading quizzes...</p>
        </div>
    </div>

</div>

<script>
    // Validate auth
    if (checkAuth('user')) {
        document.getElementById('usernameSpan').textContent = localStorage.getItem('username');
        loadDashboardData();
        loadNotifications();
    }

    async function loadDashboardData() {
        const quizzesContainer = document.getElementById('quizzesContainer');
        try {
            const response = await fetch(`${API_BASE_URL}/api/dashboard`, {
                headers: getAuthHeaders()
            });

            if (!response.ok) {
                if (response.status === 401) {
                    logout();
                    return;
                }
                throw new Error('Failed to load dashboard data');
            }

            const data = await response.json();
            
            // Set stats
            document.getElementById('currentStreak').textContent = data.user.current_streak;
            document.getElementById('longestStreak').textContent = data.user.longest_streak;
            document.getElementById('totalScore').textContent = data.total_score;

            // Render quizzes
            quizzesContainer.innerHTML = '';
            
            if (data.quizzes && data.quizzes.length > 0) {
                data.quizzes.forEach(quiz => {
                    const quizCard = document.createElement('div');
                    quizCard.className = 'dashboard-quiz-card';
                    
                    let badgesHtml = '';
                    if (quiz.attempted_list && quiz.attempted_list.length > 0) {
                        badgesHtml = `
                            <div style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; border-top: 1px solid #dee2e6; padding-top: 8px; align-items: center;">
                                <span style="font-size: 11px; color: #868e96; font-weight: bold; margin-right: 3px;">Attempted:</span>
                                ${quiz.attempted_list.map(num => `<span style="background-color: #d3f9d8; color: #2b8a3e; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold;">Q${num}</span>`).join('')}
                            </div>
                        `;
                    } else {
                        badgesHtml = `
                            <div style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; border-top: 1px solid #dee2e6; padding-top: 8px; align-items: center;">
                                <span style="font-size: 11px; color: #868e96; font-weight: bold;">Attempted: None</span>
                            </div>
                        `;
                    }

                    let attemptStatusHtml = `
                        <div style="margin: 15px 0; font-size: 14px; color: #495057; background-color: #f1f3f5; padding: 12px; border-radius: 6px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                <span>📝 Attempted:</span>
                                <strong>${quiz.questions_attempted} / ${quiz.total_questions}</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between;">
                                <span>🏆 Previous Score:</span>
                                <strong>${quiz.correct_answers} / ${quiz.total_questions}</strong>
                            </div>
                            ${badgesHtml}
                        </div>
                    `;

                    let buttonHtml = '';
                    if (quiz.total_questions > 0 && quiz.questions_attempted === quiz.total_questions) {
                        buttonHtml = `
                            <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                                <a href="quiz.html?id=${quiz.id}" class="start-quiz-btn" style="text-align: center; display: block; background-color: #2b8a3e; color: white; text-decoration: none; font-weight: bold; padding: 10px; border-radius: 6px;">
                                    📖 Practice & Review Quiz
                                </a>
                                <div style="padding: 6px 10px; background-color: #ebfbee; color: #2b8a3e; border: 1px solid #b7ebc6; border-radius: 6px; text-align: center; font-weight: bold; font-size: 12px;">
                                    ✓ Completed (${quiz.correct_answers}/${quiz.total_questions} Score)
                                </div>
                            </div>
                        `;
                    } else {
                        const btnText = quiz.questions_attempted > 0 ? '🚀 Continue Quiz' : '🚀 Start Quiz';
                        buttonHtml = `
                            <a href="quiz.html?id=${quiz.id}" class="start-quiz-btn" style="text-align: center; display: block; margin-top: 10px; text-decoration: none; font-weight: bold;">
                                ${btnText}
                            </a>
                        `;
                    }

                    quizCard.innerHTML = `
                        <div class="quiz-card-icon">💻</div>
                        <h2>${escapeHtml(quiz.title)}</h2>
                        <p>${escapeHtml(quiz.description || '')}</p>
                        ${attemptStatusHtml}
                        ${buttonHtml}
                    `;
                    quizzesContainer.appendChild(quizCard);
                });
            } else {
                quizzesContainer.innerHTML = `
                    <div class="no-quizzes">
                        <div class="no-quiz-icon">📭</div>
                        <h2>No Quizzes Available</h2>
                        <p>Check back later for new quizzes.</p>
                    </div>
                `;
            }
        } catch (err) {
            quizzesContainer.innerHTML = `
                <div class="no-quizzes" style="border-color: red;">
                    <h2>Error loading dashboard</h2>
                    <p>${err.message}</p>
                </div>
            `;
        }
    }

    async function loadNotifications() {
        const notifBadge = document.getElementById('notifBadge');
        const notifList = document.getElementById('notifList');
        try {
            const response = await fetch(`${API_BASE_URL}/api/notifications`, {
                headers: getAuthHeaders()
            });
            if (!response.ok) return;
            const data = await response.json();
            
            notifList.innerHTML = '';
            let unreadCount = 0;

            if (data.notifications && data.notifications.length > 0) {
                data.notifications.forEach(notif => {
                    if (!notif.is_read) unreadCount++;
                    const notifItem = document.createElement('div');
                    notifItem.style.padding = '12px 15px';
                    notifItem.style.borderBottom = '1px solid #f1f3f5';
                    notifItem.style.fontSize = '13px';
                    notifItem.style.lineHeight = '1.4';
                    notifItem.style.backgroundColor = notif.is_read ? 'transparent' : '#f8f9fa';

                    notifItem.innerHTML = `
                        <div style="color: #212529; font-weight: ${notif.is_read ? 'normal' : 'bold'};">${escapeHtml(notif.message)}</div>
                        <div style="color: #868e96; font-size: 10px; margin-top: 5px;">${notif.created_at}</div>
                    `;
                    notifList.appendChild(notifItem);
                });
            } else {
                notifList.innerHTML = `<div style="padding: 15px; text-align: center; color: #868e96;">No announcements yet.</div>`;
            }

            if (unreadCount > 0) {
                notifBadge.textContent = unreadCount;
                notifBadge.style.display = 'inline-block';
            } else {
                notifBadge.style.display = 'none';
            }
        } catch (err) {
            console.error('Error loading notifications:', err);
        }
    }

    function toggleNotifDropdown() {
        const dropdown = document.getElementById('notifDropdown');
        if (dropdown.style.display === 'none') {
            dropdown.style.display = 'block';
            // Mark as read when opened
            markAllNotifAsRead();
        } else {
            dropdown.style.display = 'none';
        }
    }

    async function markAllNotifAsRead() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/notifications/read`, {
                method: 'POST',
                headers: getAuthHeaders()
            });
            if (response.ok) {
                const badge = document.getElementById('notifBadge');
                badge.style.display = 'none';
            }
        } catch (err) {
            console.error('Error marking notifications as read:', err);
        }
    }

    // Close dropdown on click outside
    window.addEventListener('click', (e) => {
        const dropdown = document.getElementById('notifDropdown');
        const btn = document.getElementById('notifBtn');
        if (dropdown && dropdown.style.display === 'block' && !btn.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.style.display = 'none';
        }
    });

    function escapeHtml(text) {
        if (!text) return '';
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
