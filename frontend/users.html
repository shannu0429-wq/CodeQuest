<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - User Management</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <style>
        /* Specific layout helper for tables in users.html */
        .users-table-container {
            margin-top: 30px;
            overflow-x: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f1f3f5;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .role-admin {
            background-color: #ffe8cc;
            color: #d9480f;
        }
        .role-user {
            background-color: #e3fafc;
            color: #0c8599;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <h2>CodeQuest 👑</h2>
    <div>
        <a href="admin.html">Admin Dashboard</a>
        <a href="#" onclick="logout(); return false;">Logout</a>
    </div>
</div>

<div class="container">
    <div class="admin-header">
        <h1>👥 User Management</h1>
        <p>Inspect existing users, monitor streaks, and create new users.</p>
    </div>

    <!-- Add User Form -->
    <div class="admin-form">
        <h2>➕ Create New User</h2>
        <form id="addUserForm">
            <label>Username</label>
            <input
                type="text"
                id="usernameInput"
                placeholder="Enter username"
                required
            >
            <br>

            <label>Password</label>
            <input
                type="text"
                id="passwordInput"
                placeholder="Enter password"
                required
            >
            <br>

            <label>Role</label>
            <select id="roleSelect" required>
                <option value="user">User (Student)</option>
                <option value="admin">Admin</option>
            </select>
            <br>

            <button type="submit">
                Create User
            </button>
        </form>
    </div>

    <!-- Users Table -->
    <div class="users-table-container">
        <h2>📚 Registered Users</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Current Streak</th>
                    <th>Longest Streak</th>
                    <th>Last Quiz Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <tr>
                    <td colspan="7">Loading users...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    if (checkAuth('admin')) {
        loadUsers();
    }

    async function loadUsers() {
        const tableBody = document.getElementById('usersTableBody');
        try {
            const response = await fetch(`${API_BASE_URL}/api/admin/users`, {
                headers: getAuthHeaders()
            });

            if (!response.ok) {
                throw new Error('Failed to fetch users list');
            }

            const data = await response.json();
            tableBody.innerHTML = '';

            const currentAdminId = parseInt(localStorage.getItem('user_id'), 10);

            if (data.users && data.users.length > 0) {
                data.users.forEach(user => {
                    const tr = document.createElement('tr');
                    const roleBadgeClass = user.role === 'admin' ? 'role-admin' : 'role-user';
                    
                    // Disable delete button for the currently logged-in admin
                    const isSelf = user.id === currentAdminId;
                    const deleteBtnHtml = isSelf 
                        ? `<button class="delete-btn" style="padding: 4px 8px; font-size: 12px; margin: 0; background-color: #ced4da; cursor: not-allowed;" disabled title="You cannot delete yourself">Delete</button>` 
                        : `<button class="delete-btn" style="padding: 4px 8px; font-size: 12px; margin: 0; background-color: #e03131; color: white; border: none; border-radius: 4px; cursor: pointer;" onclick="deleteUser(${user.id}, '${escapeHtml(user.username)}')">Delete</button>`;

                    tr.innerHTML = `
                        <td>${user.id}</td>
                        <td><strong>${escapeHtml(user.username)}</strong></td>
                        <td><span class="role-badge ${roleBadgeClass}">${user.role}</span></td>
                        <td>🔥 ${user.current_streak}</td>
                        <td>🏆 ${user.longest_streak}</td>
                        <td>📅 ${user.last_quiz_date || 'Never'}</td>
                        <td>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <input type="password" id="pw_${user.id}" placeholder="New Password" style="padding: 6px; font-size: 12px; width: 110px; margin: 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                                <button class="btn edit-btn" style="padding: 6px 10px; font-size: 12px; margin: 0; font-weight: bold;" onclick="changePassword(${user.id}, '${escapeHtml(user.username)}')">Save</button>
                                ${deleteBtnHtml}
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            } else {
                tableBody.innerHTML = `<tr><td colspan="7">No users registered in the system.</td></tr>`;
            }
        } catch (err) {
            tableBody.innerHTML = `<tr><td colspan="7" style="color: red;">Error: ${err.message}</td></tr>`;
        }
    }

    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('usernameInput').value;
        const password = document.getElementById('passwordInput').value;
        const role = document.getElementById('roleSelect').value;

        try {
            const response = await fetch(`${API_BASE_URL}/api/admin/users`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ username, password, role })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Failed to create user');
            }

            document.getElementById('addUserForm').reset();
            loadUsers();
        } catch (err) {
            alert(err.message);
        }
    });

    async function deleteUser(userId, username) {
        if (!confirm(`Are you sure you want to delete the user "${username}"?`)) {
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/api/admin/users/${userId}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Failed to delete user');
            }

            loadUsers();
        } catch (err) {
            alert(err.message);
        }
    }

    async function changePassword(userId, username) {
        const passwordInput = document.getElementById(`pw_${userId}`);
        const password = passwordInput.value.trim();

        if (!password) {
            alert('Please enter a new password first.');
            return;
        }

        if (!confirm(`Change password for "${username}"?`)) {
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/api/admin/users/${userId}/password`, {
                method: 'PUT',
                headers: getAuthHeaders(),
                body: JSON.stringify({ password })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Failed to update password');
            }

            alert(`Password for "${username}" updated successfully!`);
            passwordInput.value = '';
        } catch (err) {
            alert(err.message);
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
