<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - Quiz</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <style>
        /* Interactive options and results styling */
        .option.correct {
            background-color: #ebfbee !important;
            border-color: #2f9e44 !important;
            color: #2f9e44 !important;
        }
        .option.incorrect {
            background-color: #fff5f5 !important;
            border-color: #e03131 !important;
            color: #e03131 !important;
        }
        .option.correct .option-letter {
            background-color: #2f9e44 !important;
            color: white !important;
        }
        .option.incorrect .option-letter {
            background-color: #e03131 !important;
            color: white !important;
        }
        .question-submit-btn {
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #228be6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .question-submit-btn:hover {
            background-color: #1c7ed6;
        }
        .question-submit-btn:disabled {
            background-color: #ced4da;
            cursor: not-allowed;
        }
        .details-link {
            color: #228be6;
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
            display: inline-block;
            margin-top: 12px;
            font-weight: bold;
        }
        .details-box {
            margin-top: 10px;
            background: #f8f9fa;
            border: 1px dashed #dee2e6;
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 13px;
            color: #495057;
            line-height: 1.5;
        }
        .solution-box {
            margin-top: 15px;
            padding: 12px;
            background: #e8f4fd;
            border-left: 4px solid #1c7ed6;
            border-radius: 4px;
            font-size: 14px;
            color: #2b3a42;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <h2>CodeQuest 💻</h2>
    <div style="display: flex; gap: 18px; align-items: center;">
        <!-- Notification Dropdown Toggle -->
        <div class="notif-container" style="position: relative; display: inline-block;">
            <button id="notifBtn" onclick="toggleNotifDropdown()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: white; position: relative; padding: 5px;">
                🔔<span id="notifBadge" style="position: absolute; top: -2px; right: -2px; background-color: #e03131; color: white; font-size: 10px; font-weight: bold; border-radius: 50%; padding: 2px 6px; display: none;">0</span>
            </button>
            <div id="notifDropdown" style="display: none; position: absolute; right: 0; top: 35px; width: 300px; background: white; border: 1px solid #dee2e6; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 8px; z-index: 1000; max-height: 400px; overflow-y: auto;">
                <div style="padding: 12px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; color: #333;">
                    <span>Announcements</span>
                    <button onclick="markAllNotifAsRead()" style="background: none; border: none; font-size: 12px; color: #228be6; cursor: pointer; text-decoration: underline; padding: 0;">Mark Read</button>
                </div>
                <div id="notifList" style="padding: 0; margin: 0; color: #495057;">
                    <div style="padding: 15px; text-align: center; color: #868e96;">No notifications.</div>
                </div>
            </div>
        </div>
        <a href="dashboard.html" style="color: white; text-decoration: none; font-weight: bold;">Dashboard</a>
        <a href="#" onclick="logout(); return false;" style="color: white; text-decoration: none; font-weight: bold;">Logout</a>
    </div>
</div>

<div class="quiz-container">
    <!-- Quiz Header -->
    <div class="quiz-header" id="quizHeader">
        <div>
            <h1 id="quizTitle">Loading Quiz...</h1>
            <p id="quizDescription"></p>
        </div>
        <div class="quiz-badge">🧠 Quiz</div>
    </div>

    <form id="quizForm" style="display: none;" onsubmit="return false;">
        <!-- Questions container -->
        <div id="questionsContainer"></div>
    </form>

    <div class="empty-card" id="noQuestionsCard" style="display: none;">
        <h2>📭 No Questions Available</h2>
        <p>The administrator has not added questions to this quiz yet.</p>
        <br>
        <a href="dashboard.html" class="btn">Back to Dashboard</a>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const quizId = urlParams.get('id');

    if (!quizId) {
        window.location.href = 'dashboard.html';
    }

    if (checkAuth('user')) {
        loadQuiz();
        loadNotifications();
    }

    async function loadQuiz() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/quiz/${quizId}`, {
                headers: getAuthHeaders()
            });

            if (!response.ok) {
                if (response.status === 401) {
                    logout();
                    return;
                }
                throw new Error('Failed to load quiz');
            }

            const data = await response.json();

            // Set Header
            document.getElementById('quizTitle').textContent = data.quiz.title;
            document.getElementById('quizDescription').textContent = data.quiz.description || '';

            const questionsContainer = document.getElementById('questionsContainer');
            questionsContainer.innerHTML = '';

            if (data.questions && data.questions.length > 0) {
                document.getElementById('quizForm').style.display = 'block';

                data.questions.forEach((question, index) => {
                    const idx = index + 1;
                    const questionCard = document.createElement('div');
                    questionCard.className = 'quiz-question-card';
                    questionCard.id = `card_${question.id}`;

                    let codeHtml = '';
                    if (question.code) {
                        codeHtml = `
                            <div class="code-container">
                                <div class="code-header">
                                    <span>💻 Code</span>
                                </div>
                                <pre><code>${escapeHtml(question.code)}</code></pre>
                            </div>
                        `;
                    }

                    // Format custom ID
                    const cleanTitle = data.quiz.title.replace(/\s+/g, '_');
                    const customQuestionId = `#${cleanTitle}_${idx}`;

                    // Check if already answered
                    const hasAnswered = data.answers && data.answers[question.id] !== undefined;
                    let userAns = null;
                    if (hasAnswered) {
                        userAns = data.answers[question.id].user_answer;
                    }

                    // Options highlighting helper
                    const getOptionClass = (optLetter) => {
                        if (!hasAnswered) return '';
                        const correctAns = question.correct_answer;
                        if (optLetter === correctAns) return 'correct';
                        if (userAns === optLetter && optLetter !== correctAns) return 'incorrect';
                        return '';
                    };

                    const getCheckedAttr = (optLetter) => {
                        return (userAns === optLetter) ? 'checked' : '';
                    };

                    const disabledAttr = hasAnswered ? 'disabled' : '';

                    // Solution html if answered
                    let solutionHtml = '';
                    if (hasAnswered && (question.solution_text || question.solution_image)) {
                        solutionHtml = `
                            <div class="solution-box">
                                <strong>💡 Solution:</strong>
                                ${question.solution_text ? `<p style="margin: 5px 0 0 0;">${escapeHtml(question.solution_text)}</p>` : ''}
                                ${question.solution_image ? `<img src="${escapeHtml(question.solution_image)}" style="max-width: 100%; margin-top: 10px; border-radius: 4px; display: block;">` : ''}
                            </div>
                        `;
                    }

                    // Upload Date & ID accordion
                    const uploadDateVal = question.created_at || 'Recently';
                    const detailsAccordionHtml = `
                        <a class="details-link" onclick="toggleDetails(${question.id})">details</a>
                        <div class="details-box" id="details_${question.id}" style="display: none;">
                            <strong>Uploaded On:</strong> ${escapeHtml(uploadDateVal)}<br>
                            <strong>Question ID:</strong> <code>${escapeHtml(customQuestionId)}</code>
                        </div>
                    `;

                    let actionHtml = '';
                    if (!hasAnswered) {
                        actionHtml = `
                            <button type="button" class="question-submit-btn" id="btn_${question.id}" onclick="submitSingleQuestion(${question.id})">
                                Submit Answer
                            </button>
                        `;
                    } else {
                        actionHtml = `<span style="font-weight: bold; color: #2f9e44; font-size: 14px; display: inline-block; margin-top: 10px;">Submitted ✓</span>`;
                    }

                    questionCard.innerHTML = `
                        <div class="question-top">
                            <span class="question-number">Question ${idx}</span>
                            <span class="question-count">${idx} / ${data.questions.length}</span>
                        </div>
                        <h2>${escapeHtml(question.question)}</h2>
                        ${codeHtml}
                        <div class="options" id="opts_${question.id}">
                            <label class="option ${getOptionClass('A')}" id="lbl_${question.id}_A">
                                <input type="radio" name="question_${question.id}" value="A" ${getCheckedAttr('A')} ${disabledAttr} required>
                                <span class="option-letter">A</span>
                                <span class="option-text">${escapeHtml(question.option_a)}</span>
                            </label>
                            <label class="option ${getOptionClass('B')}" id="lbl_${question.id}_B">
                                <input type="radio" name="question_${question.id}" value="B" ${getCheckedAttr('B')} ${disabledAttr}>
                                <span class="option-letter">B</span>
                                <span class="option-text">${escapeHtml(question.option_b)}</span>
                            </label>
                            <label class="option ${getOptionClass('C')}" id="lbl_${question.id}_C">
                                <input type="radio" name="question_${question.id}" value="C" ${getCheckedAttr('C')} ${disabledAttr}>
                                <span class="option-letter">C</span>
                                <span class="option-text">${escapeHtml(question.option_c)}</span>
                            </label>
                            <label class="option ${getOptionClass('D')}" id="lbl_${question.id}_D">
                                <input type="radio" name="question_${question.id}" value="D" ${getCheckedAttr('D')} ${disabledAttr}>
                                <span class="option-letter">D</span>
                                <span class="option-text">${escapeHtml(question.option_d)}</span>
                            </label>
                        </div>
                        <div id="sol_container_${question.id}">
                            ${solutionHtml}
                        </div>
                        <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                            ${actionHtml}
                            <div style="text-align: right;">
                                ${detailsAccordionHtml}
                            </div>
                        </div>
                    `;
                    questionsContainer.appendChild(questionCard);
                });
            } else {
                document.getElementById('noQuestionsCard').style.display = 'block';
            }
        } catch (err) {
            document.getElementById('quizTitle').textContent = 'Error loading quiz';
            document.getElementById('quizDescription').textContent = err.message;
        }
    }

    async function submitSingleQuestion(questionId) {
        const optionsContainer = document.getElementById(`opts_${questionId}`);
        const selectedRadio = optionsContainer.querySelector('input[type="radio"]:checked');
        const submitBtn = document.getElementById(`btn_${questionId}`);

        if (!selectedRadio) {
            alert('Please select an option first.');
            return;
        }

        const selectedAnswer = selectedRadio.value;

        // Disable all inputs for this question immediately
        const radios = optionsContainer.querySelectorAll('input[type="radio"]');
        radios.forEach(r => r.disabled = true);
        submitBtn.disabled = true;

        try {
            const response = await fetch(`${API_BASE_URL}/api/quiz/${quizId}/submit-single`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({
                    question_id: questionId,
                    user_answer: selectedAnswer
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Failed to submit answer');
            }

            const correctOption = data.correct_answer;

            // Highlight selected and correct answers
            radios.forEach(radio => {
                const label = document.getElementById(`lbl_${questionId}_${radio.value}`);
                if (radio.value === correctOption) {
                    label.classList.add('correct');
                } else if (radio.value === selectedAnswer) {
                    label.classList.add('incorrect');
                }
            });

            // Show solution if provided by admin
            if (data.solution_text || data.solution_image) {
                const solContainer = document.getElementById(`sol_container_${questionId}`);
                solContainer.innerHTML = `
                    <div class="solution-box">
                        <strong>💡 Solution:</strong>
                        ${data.solution_text ? `<p style="margin: 5px 0 0 0;">${escapeHtml(data.solution_text)}</p>` : ''}
                        ${data.solution_image ? `<img src="${escapeHtml(data.solution_image)}" style="max-width: 100%; margin-top: 10px; border-radius: 4px; display: block;">` : ''}
                    </div>
                `;
            }

            submitBtn.outerHTML = `<span style="font-weight: bold; color: #2f9e44; font-size: 14px; display: inline-block; margin-top: 10px;">Submitted ✓</span>`;
        } catch (err) {
            alert(err.message);
            // Re-enable inputs if failed
            radios.forEach(r => r.disabled = false);
            submitBtn.disabled = false;
        }
    }

    function toggleDetails(questionId) {
        const detailsBox = document.getElementById(`details_${questionId}`);
        if (detailsBox.style.display === 'none') {
            detailsBox.style.display = 'block';
        } else {
            detailsBox.style.display = 'none';
        }
    }

    async function loadNotifications() {
        const notifBadge = document.getElementById('notifBadge');
        const notifList = document.getElementById('notifList');
        try {
            const response = await fetch(`${API_BASE_URL}/api/notifications`, {
                headers: getAuthHeaders()
            });
            if (!response.ok) return;
            const data = await response.json();
            
            notifList.innerHTML = '';
            let unreadCount = 0;

            if (data.notifications && data.notifications.length > 0) {
                data.notifications.forEach(notif => {
                    if (!notif.is_read) unreadCount++;
                    const notifItem = document.createElement('div');
                    notifItem.style.padding = '12px 15px';
                    notifItem.style.borderBottom = '1px solid #f1f3f5';
                    notifItem.style.fontSize = '13px';
                    notifItem.style.lineHeight = '1.4';
                    notifItem.style.backgroundColor = notif.is_read ? 'transparent' : '#f8f9fa';

                    notifItem.innerHTML = `
                        <div style="color: #212529; font-weight: ${notif.is_read ? 'normal' : 'bold'};">${escapeHtml(notif.message)}</div>
                        <div style="color: #868e96; font-size: 10px; margin-top: 5px;">${notif.created_at}</div>
                    `;
                    notifList.appendChild(notifItem);
                });
            } else {
                notifList.innerHTML = `<div style="padding: 15px; text-align: center; color: #868e96;">No announcements yet.</div>`;
            }

            if (unreadCount > 0) {
                notifBadge.textContent = unreadCount;
                notifBadge.style.display = 'inline-block';
            } else {
                notifBadge.style.display = 'none';
            }
        } catch (err) {
            console.error('Error loading notifications:', err);
        }
    }

    function toggleNotifDropdown() {
        const dropdown = document.getElementById('notifDropdown');
        if (dropdown.style.display === 'none') {
            dropdown.style.display = 'block';
            // Mark as read when opened
            markAllNotifAsRead();
        } else {
            dropdown.style.display = 'none';
        }
    }

    async function markAllNotifAsRead() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/notifications/read`, {
                method: 'POST',
                headers: getAuthHeaders()
            });
            if (response.ok) {
                const badge = document.getElementById('notifBadge');
                badge.style.display = 'none';
            }
        } catch (err) {
            console.error('Error marking notifications as read:', err);
        }
    }

    // Close dropdown on click outside
    window.addEventListener('click', (e) => {
        const dropdown = document.getElementById('notifDropdown');
        const btn = document.getElementById('notifBtn');
        if (dropdown && dropdown.style.display === 'block' && !btn.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.style.display = 'none';
        }
    });

    function escapeHtml(text) {
        if (!text) return '';
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
