<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - Admin Dashboard</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <h2>CodeQuest 👑</h2>
    <div>
        <a href="users.html" target="_blank" style="margin-right: 15px; color: white; text-decoration: none; font-weight: bold;">👥 Manage Users</a>
        <span>Admin Panel</span>
        <a href="#" onclick="logout(); return false;">Logout</a>
    </div>
</div>

<div class="container">
    <!-- Welcome -->
    <div class="admin-header">
        <h1>Welcome, Admin 👋</h1>
        <p>Manage quizzes and questions from here.</p>
    </div>

    <!-- Admin Statistics -->
    <div class="card-container">
        <div class="card">
            <h3>📝 Quizzes</h3>
            <div class="stat-number" id="quizCount">0</div>
            <p>Available quizzes</p>
        </div>

        <div class="card">
            <h3>👑 Role</h3>
            <div class="stat-number">Admin</div>
            <p>Full access</p>
        </div>

        <div class="card" style="cursor: pointer;" onclick="window.open('users.html', '_blank')">
            <h3>👥 Users</h3>
            <div class="stat-number" id="userCount">0</div>
            <p>Manage users &rarr;</p>
        </div>
    </div>

    <!-- Add Quiz -->
    <div class="admin-form">
        <h2>➕ Add New Quiz</h2>
        <form id="addQuizForm">
            <label>Quiz Title</label>
            <input
                type="text"
                id="quizTitle"
                placeholder="Example: Python Basics"
                required
            >
            <br>

            <label>Description</label>
            <textarea
                id="quizDescription"
                rows="4"
                placeholder="Enter quiz description"
                required
            ></textarea>
            <br>

            <button type="submit">
                Add Quiz
            </button>
        </form>
    </div>

    <!-- Existing Quizzes -->
    <h2 class="section-title">
        📚 Manage Quizzes
    </h2>

    <div id="quizzesGrid" class="admin-quiz-grid">
        <!-- Loaded dynamically -->
        <p>Loading quizzes...</p>
    </div>
</div>

<script>
    if (checkAuth('admin')) {
        loadAdminData();
    }

    async function loadAdminData() {
        const quizzesGrid = document.getElementById('quizzesGrid');
        try {
            const response = await fetch(`${API_BASE_URL}/api/admin`, {
                headers: getAuthHeaders()
            });

            if (!response.ok) {
                if (response.status === 401) {
                    logout();
                    return;
                }
                throw new Error('Failed to fetch admin data');
            }

            const data = await response.json();
            
            // Set stats
            document.getElementById('quizCount').textContent = data.quizzes.length;

            // Fetch and set user count
            try {
                const usersResponse = await fetch(`${API_BASE_URL}/api/admin/users`, {
                    headers: getAuthHeaders()
                });
                if (usersResponse.ok) {
                    const usersData = await usersResponse.json();
                    document.getElementById('userCount').textContent = usersData.users.length;
                }
            } catch (err) {
                console.error("Failed to load user count", err);
            }

            // Render quizzes
            quizzesGrid.innerHTML = '';
            
            if (data.quizzes && data.quizzes.length > 0) {
                data.quizzes.forEach(quiz => {
                    const card = document.createElement('div');
                    card.className = 'admin-quiz-card';
                    card.innerHTML = `
                        <div class="quiz-icon">💻</div>
                        <h2>${escapeHtml(quiz.title)}</h2>
                        <p>${escapeHtml(quiz.description || '')}</p>
                        <div class="admin-actions">
                            <a class="btn edit-btn" href="questions.html?id=${quiz.id}">
                                📝 Manage Questions
                            </a>
                            <button class="delete-btn" onclick="deleteQuiz(${quiz.id})">
                                🗑️ Delete Quiz
                            </button>
                        </div>
                    `;
                    quizzesGrid.appendChild(card);
                });
            } else {
                quizzesGrid.innerHTML = `
                    <div class="empty-card">
                        <h2>📭 No Quizzes</h2>
                        <p>You haven't created any quizzes yet.</p>
                    </div>
                `;
            }
        } catch (err) {
            quizzesGrid.innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
        }
    }

    document.getElementById('addQuizForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('quizTitle').value;
        const description = document.getElementById('quizDescription').value;

        try {
            const response = await fetch(`${API_BASE_URL}/api/admin/add-quiz`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ title, description })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Failed to add quiz');
            }

            // Reset form and reload data
            document.getElementById('addQuizForm').reset();
            loadAdminData();
        } catch (err) {
            alert(err.message);
        }
    });

    async function deleteQuiz(quizId) {
        if (!confirm('Are you sure you want to delete this quiz?')) return;

        try {
            const response = await fetch(`${API_BASE_URL}/api/admin/quiz/${quizId}/delete`, {
                method: 'POST',
                headers: getAuthHeaders()
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Failed to delete quiz');
            }

            loadAdminData();
        } catch (err) {
            alert(err.message);
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
